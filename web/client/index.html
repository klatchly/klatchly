    <style>
      html, body, #root { height: 100%; margin: 0; }
      html, body { background: #f4f5f7; }
      .splash { height: 100%; display: grid; place-items: center; }
      .splash .gate-mark { width: 72px; height: 72px; border-radius: 50%; background: #5b7c99; opacity: 0.9; animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.4; } }
      @media (prefers-color-scheme: dark) {
        html, body { background: #14191e; }
        .splash .gate-mark { background: #7a9bb8; }
      }
      @media (prefers-reduced-motion: reduce) { .splash .gate-mark { animation: none; } }
